services:
  pg-stock:
    image: postgres:latest
    container_name: pg-stock
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      POSTGRES_DB: ${POSTGRES_DB:-admin}
    # stock-coin-trade 백엔드가 postgresql_default 네트워크에서 직접 접속한다.
    # Docker Desktop의 호스트 포트 전달 오류를 피하고 DB를 외부에 노출하지 않는다.
    expose:
      - "5432"
    volumes:
      # postgres:18+ images store data under a major-version subdirectory,
      # so mount the parent /var/lib/postgresql (NOT .../data) directly.
      - pg_stock_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_stock_data:
    name: pg_stock_data
